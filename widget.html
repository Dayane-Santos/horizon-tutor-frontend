<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Chat Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header do Widget -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span class="font-bold text-sm text-amber-400" id="tutorName">Tutor Ativo</span>
        </div>
        <button onclick="reiniciarSessao()" class="text-xs text-gray-400 hover:text-white">Limpar Chat</button>
    </header>

    <!-- Histórico de Mensagens -->
    <main id="chatArea" class="flex-1 p-4 space-y-3 overflow-y-auto max-h-[380px] text-sm">
        <div class="bg-gray-900 text-gray-300 p-3 rounded-lg max-w-[85%]">
            Olá! Como posso te ajudar hoje?
        </div>
    </main>

    <!-- Campo de Digitação -->
    <footer class="p-3 bg-gray-900 border-t border-gray-800 flex items-center space-x-2">
        <input type="text" id="userInput" placeholder="Escreva sua pergunta..." class="flex-1 bg-gray-800 border border-gray-700 rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
        <button id="sendBtn" onclick="enviarMensagem()" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold p-2 rounded-full transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
        </button>
    </footer>

    <script>
        const API_URL = 'http://localhost:3001/api';
        
        // Pega parâmetros da URL (ex: ?tutorId=tutor-matematica)
        const urlParams = new URLSearchParams(window.location.search);
        const tutorId = urlParams.get('tutorId') || 'tutor-padrao';
        
        // Mantém uma ID de sessão única gerada no primeiro acesso
        let sessionId = localStorage.getItem(`session_${tutorId}`);
        if (!sessionId) {
            sessionId = 'session_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem(`session_${tutorId}`, sessionId);
        }

        async function obterNomeTutor() {
            try {
                const res = await fetch(`${API_URL}/tutores/${tutorId}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('tutorName').innerText = data.titulo;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessage('user', text);

            // Adiciona balão de "digitando..."
            const typingId = appendMessage('system', 'Digitando...');

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tutorId, sessionId, message: text })
                });

                const data = await response.json();
                document.getElementById(typingId).remove(); // Remove o "digitando"

                if (response.ok) {
                    appendMessage('assistant', data.reply);
                } else {
                    appendMessage('assistant', "Desculpe, tive um problema ao buscar essa resposta.");
                }
            } catch (error) {
                document.getElementById(typingId).remove();
                appendMessage('assistant', "Erro na conexão com o servidor do Tutor.");
            }
        }

        function appendMessage(role, text) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            const id = 'msg_' + Math.random().toString(36).substring(2, 11);
            msgDiv.id = id;

            if (role === 'user') {
                msgDiv.className = 'bg-amber-500 text-gray-900 p-3 rounded-lg max-w-[85%] ml-auto font-medium';
            } else if (role === 'system') {
                msgDiv.className = 'bg-gray-800 text-gray-500 p-2 rounded italic text-xs max-w-[50%] mr-auto';
            } else {
                msgDiv.className = 'bg-gray-900 text-gray-200 p-3 rounded-lg max-w-[85%] mr-auto border border-gray-800';
            }

            msgDiv.innerText = text;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function reiniciarSessao() {
            localStorage.removeItem(`session_${tutorId}`);
            location.reload();
        }

        // Listener para enviar mensagem ao pressionar "Enter"
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensagem();
        });

        obterNomeTutor();
    </script>
</body>
</html>
