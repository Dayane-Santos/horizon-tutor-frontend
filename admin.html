<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin de Tutores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-amber-500">Horizon</h1>
            <p class="text-gray-400">Gerenciador de Tutores Personalizados (MVP)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Form de Cadastro -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-amber-400">Criar Novo Tutor</h2>
                <form id="tutorForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ID Único (ex: tutor-matematica)</label>
                        <input type="text" id="tutorId" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Título/Nome do Tutor</label>
                        <input type="text" id="titulo" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Instruções de Comportamento (Persona)</label>
                        <textarea id="instrucoes" rows="4" required class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white" placeholder="Ex: Você é um professor de C# sarcástico..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">URL da Fonte de Conhecimento (Opcional)</label>
                        <input type="url" id="fonteUrl" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white" placeholder="https://exemplo.com/doc.txt">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 rounded transition">Salvar Tutor</button>
                </form>
            </div>

            <!-- Lista de Tutores e Embeds -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-amber-400">Seus Tutores</h2>
                <div id="tutoresList" class="space-y-4 max-h-[450px] overflow-y-auto">
                    <!-- Gerado por JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api';

        document.getElementById('tutorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                id: document.getElementById('tutorId').value,
                titulo: document.getElementById('titulo').value,
                instrucoes: document.getElementById('instrucoes').value,
                fonte_url: document.getElementById('fonteUrl').value
            };

            const res = await fetch(`${API_URL}/tutores`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Tutor registrado com sucesso!');
                document.getElementById('tutorForm').reset();
                carregarTutores();
            } else {
                alert('Erro ao registrar.');
            }
        });

        async function carregarTutores() {
            const res = await fetch(`${API_URL}/tutores`);
            const tutores = await res.json();
            const container = document.getElementById('tutoresList');
            container.innerHTML = '';

            tutores.forEach(tutor => {
                const embedCode = `<iframe src="${window.location.origin}/widget.html?tutorId=${tutor.id}" width="100%" height="500px" style="border:none;"></iframe>`;
                
                container.innerHTML += `
                    <div class="border border-gray-700 p-4 rounded bg-gray-900/50">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-white">${tutor.titulo}</span>
                            <span class="px-2 py-0.5 text-xs rounded bg-green-900 text-green-300 font-semibold">${tutor.status.toUpperCase()}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-2 font-mono">ID: ${tutor.id}</p>
                        <div class="mt-2">
                            <label class="block text-xs text-gray-500 mb-1">Código de Embed (Copie e cole no seu site):</label>
                            <textarea readonly class="w-full bg-gray-800 text-xs font-mono p-1 rounded text-amber-300 border border-gray-700" rows="2">${embedCode}</textarea>
                        </div>
                    </div>
                `;
            });
        }

        carregarTutores();
    </script>
</body>
</html>
